name: release
on: { push: { branches: [main] } }
permissions: read-all

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with: { config-file: .releaserc.json }

  images:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy: { matrix: { target: [api, worker, scheduler] } }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/tinysecrets/propulse-${{ matrix.target }}:${{ needs.release-please.outputs.version }}
            ghcr.io/tinysecrets/propulse-${{ matrix.target }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ github.event.repository.pushed_at }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/tinysecrets/propulse-${{ matrix.target }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: cosign keyless sign
        run: |
          cosign sign --yes \
            ghcr.io/tinysecrets/propulse-${{ matrix.target }}@${{ steps.build.outputs.digest }}

  pypi:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --all-packages
      - run: uv run python scripts/verify_wheel_license.py dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  android-publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - run: ./gradlew :propulse-sdk:publishReleasePublicationToMavenCentral
        working-directory: packages/sdk-android
        env:
          MAVEN_CENTRAL_USER: ${{ secrets.MAVEN_CENTRAL_USER }}
          MAVEN_CENTRAL_PASS: ${{ secrets.MAVEN_CENTRAL_PASS }}
          SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

  assets:
    needs: [release-please, images]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with: { format: spdx-json, output-file: sbom.spdx.json }
      - run: ./scripts/verify-release.sh
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: sbom.spdx.json }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag }}
          files: |
            sbom.spdx.json
            docs/openapi.json
          generate_release_notes: false

  deploy-staging:
    needs: [release-please, images]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: assume cloud role via OIDC (no static keys)
        run: echo "configure aws/gcp OIDC here"
      - run: ./scripts/deploy.sh staging ${{ needs.release-please.outputs.version }}
      - run: ./scripts/smoke.sh https://staging.propulse.wah-lah.com

  promote-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy.sh prod ${{ needs.release-please.outputs.version }} --canary 5
      - run: ./scripts/smoke.sh https://api.propulse.wah-lah.com
      - name: canary soak with auto-rollback on SLO burn
        run: ./scripts/canary-watch.sh --minutes 15 --auto-rollback
