name: ci
on:
  push: { branches: [main, "release/**"] }
  pull_request:
  merge_group:
permissions: read-all
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env: { PYTHON_VERSION: "3.12" }

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy --strict packages apps
      - run: uv run reuse lint
      - run: uv run python scripts/check_license_boundary.py
      - run: uv run python scripts/check_env_defaults.py

  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.11", "3.12"] }, fail-fast: false }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --frozen
      - run: uv run pytest tests/unit -q --cov --cov-report=xml
      - uses: codecov/codecov-action@v5
        with: { files: coverage.xml, fail_ci_if_error: false }

  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      MONGO_URI: mongodb://localhost:27017/propulse_test
      REDIS_URL: redis://localhost:6379/1
      BUS_DRIVER: redis
      BILLING_DRIVER: null
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --frozen
      - run: uv run python -m propulse_api.cli migrate
      - run: uv run pytest tests/integration -q

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --frozen
      - run: uv run python -m propulse_api.cli export-openapi > /tmp/openapi.json
      - name: fail on breaking API change
        run: uv run python scripts/diff_openapi.py docs/openapi.json /tmp/openapi.json
      - name: every public route documented
        run: uv run python scripts/check_route_docs.py

  migration-safety:
    runs-on: ubuntu-latest
    services:
      mongo: { image: mongo:7, ports: ["27017:27017"] }
    env:
      MONGO_URI: mongodb://localhost:27017/propulse_migration
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --frozen
      # the previous release must still boot against the new schema (expand/contract)
      - run: uv run pytest tests/integration/test_migration_compat.py -q

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/sdk-android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - run: ./gradlew lint testDebugUnitTest --no-daemon
      - run: ./gradlew dependencyVerification --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: packages/sdk-android/**/build/reports/

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --frozen
      - name: hot path must not regress >10%
        run: |
          uv run pytest tests/bench -q \
            --benchmark-compare-fail=mean:10% \
            --benchmark-autosave

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run mkdocs build --strict

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: wait for healthy
        run: ./scripts/wait-healthy.sh
      - run: docker compose run --rm api python -m propulse_api.cli seed
      - run: docker compose run --rm api python -m propulse_api.cli demo
      - name: capture AGPL disclosure
        run: curl -fsS localhost:8080/source | tee /tmp/source.json
      - name: assert AGPL section 13 disclosure
        run: |
          python - <<'PY'
          import json
          d = json.load(open("/tmp/source.json"))
          assert d["license"] == "AGPL-3.0-or-later", d
          assert d["repo"].startswith("https://github.com/"), d
          assert "notices" in d
          print("AGPL section 13 disclosure verified")
          PY
      - name: assert headless billing funnel
        run: |
          curl -fsS localhost:8080/v1/billing/plans | tee /tmp/plans.json
          curl -fsS localhost:8080/v1/license/tiers | tee /tmp/tiers.json
          python - <<'PY'
          import json
          plans = json.load(open("/tmp/plans.json"))["plans"]
          tiers = json.load(open("/tmp/tiers.json"))["tiers"]
          assert {p["id"] for p in plans} >= {"free", "pro", "team"}
          assert {t["price_usd"] for t in tiers} == {15000, 25000}
          print("commercial funnel verified")
          PY
      - name: upload logs on failure
        if: failure()
        run: docker compose logs --no-color > /tmp/compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: compose-logs, path: /tmp/compose.log }

  ci-required:
    if: always()
    needs: [lint, test, integration, contract, migration-safety, android, benchmarks, docs, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          r='${{ join(needs.*.result, ' ') }}'
          echo "results: $r"
          [[ "$r" != *failure* && "$r" != *cancelled* ]]
