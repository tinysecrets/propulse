repository:
  name: propulse
  description: "Make any app proactive. Background event-driven agent orchestrator with native Android polling, FastAPI, and MongoDB."
  homepage: https://propulse.wah-lah.com
  topics: android, fastapi, mongodb, event-driven, agent-orchestrator, proactive-notifications, kotlin, python, agpl, open-core, background-jobs, voice
  has_issues: true
  has_wiki: false
  has_projects: false
  has_discussions: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        require_code_owner_reviews: true
        dismiss_stale_reviews: true
        require_last_push_approval: true
      required_status_checks:
        strict: true
        contexts: ["ci-required", "security"]
      enforce_admins: true
      required_linear_history: true
      required_conversation_resolution: true
      allow_force_pushes: false
      allow_deletions: false
  - name: "release/*"
    protection:
      required_pull_request_reviews: { required_approving_review_count: 1 }
      enforce_admins: false

labels:
  - { name: "bug", color: "d73a4a", description: "Something is broken" }
  - { name: "enhancement", color: "a2eeef", description: "New capability" }
  - { name: "security", color: "0e8a16", description: "Security relevant" }
  - { name: "breaking", color: "b60205", description: "Public API break" }
  - { name: "deps", color: "0366d6", description: "Dependency update" }
  - { name: "good-first-issue", color: "7057ff" }
  - { name: "help-wanted", color: "008672" }
  - { name: "stale", color: "ededed" }
  - { name: "triage", color: "fbca04" }
  - { name: "area:core", color: "1d76db" }
  - { name: "area:api", color: "1d76db" }
  - { name: "area:sdk-android", color: "1d76db" }
  - { name: "area:docs", color: "1d76db" }
