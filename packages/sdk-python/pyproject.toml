[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "propulse-sdk"
version = "1.0.0"
description = "Apache-2.0 Python client for the ProPulse API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["propulse_sdk"]
